# Publicação automática do site.
# A cada alteração na branch main (inclusive as feitas pelo painel Pages CMS):
#   1. instala, gera o site (npm run build) e para se algo estiver quebrado;
#   2. SÓ ENVIA ao HostGator se a variável do repositório PUBLICAR for "sim".
#      Até o site ir ao ar, deixe PUBLICAR desligada: a automação só confere que o build passa,
#      sem tocar no WordPress atual.
#
# Configuração (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVIDOR, FTP_USUARIO, FTP_SENHA   (dados do FTP no cPanel do HostGator)
#              RESEND_API_KEY   (envio do formulário pelo Resend; conta criada com o e-mail de DESTINO)
#              SMTP_USUARIO, SMTP_SENHA   (alternativa: caixa da Titan; ver contato.php)
#   Variables: PUBLICAR = sim  (liga o envio)
#              FTP_PASTA       (opcional; padrão /public_html/)
#              FTP_PROTOCOLO   (opcional; ftps ou ftp; padrão ftps)

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" para publicar manualmente

permissions:
  contents: read

# nunca dois envios ao mesmo tempo: um novo commit espera o anterior terminar
# (não cancela, para nunca interromper um envio pela metade)
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o Node (mesma versão do computador do projeto)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site
        # para aqui se o conteúdo quebrar o build (ex.: frente apontando para módulo inexistente)
        run: npm run build

      - name: Conferir o resultado
        run: |
          test -f dist/index.html
          test -f dist/contato.php
          echo "Build ok: $(du -sh dist | cut -f1) em dist/"

      - name: Testar no servidor (Apache + PHP, como no HostGator)
        # páginas, 404, redirecionamentos, bloqueios, cabeçalhos e as proteções do formulário
        run: bash scripts/testar-servidor.sh

      - name: Configurar o envio de e-mail do formulário (SMTP da Titan)
        # gera dist/smtp-config.php a partir dos segredos (bloqueado pela web no .htaccess).
        # Sem os segredos, o arquivo não é criado e o contato.php usa o mail() do servidor.
        if: ${{ vars.PUBLICAR == 'sim' }}
        # ordem no contato.php: Resend (RESEND_API_KEY) > SMTP da Titan (SMTP_USUARIO/SMTP_SENHA) > mail()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
        run: |
          if [ -n "$RESEND_API_KEY" ] || { [ -n "$SMTP_USUARIO" ] && [ -n "$SMTP_SENHA" ]; }; then
            php -r '$c = ["servidor" => "smtp.titan.email", "porta" => 465, "usuario" => getenv("SMTP_USUARIO") ?: "", "senha" => getenv("SMTP_SENHA") ?: "", "resend_chave" => getenv("RESEND_API_KEY") ?: ""]; echo "<?php\n// gerado pela automação; não editar\nreturn " . var_export($c, true) . ";\n";' > dist/smtp-config.php
            php -l dist/smtp-config.php
            if [ -n "$RESEND_API_KEY" ]; then echo "Formulário envia pelo Resend"; else echo "Formulário envia pelo SMTP da Titan"; fi
          else
            echo "Sem segredos de e-mail: o formulário usa o mail() do servidor."
          fi

      - name: Enviar ao HostGator (FTP)
        if: ${{ vars.PUBLICAR == 'sim' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ${{ vars.FTP_PROTOCOLO || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_PASTA || '/public_html/' }}
          # envia só o que mudou (guarda um registro no servidor) e nunca apaga a pasta inteira
          dangerous-clean-slate: false
          # segunda trava: a pasta simulada do teste nunca é enviada
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            wp-antigo/**

      - name: Envio desligado
        if: ${{ vars.PUBLICAR != 'sim' }}
        run: |
          echo "PUBLICAR não está como 'sim': site gerado e conferido, mas NÃO enviado ao HostGator."
